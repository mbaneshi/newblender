[package]
name = "p04-kernel"
version = "0.0.0"
edition = "2021"
publish = false
description = "Probe P04: a minimal mesh kernel (grid, midpoint subdivision, normals) compiled to WASM and native"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wasm-bindgen = "0.2"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
